<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unable to load page</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background:#0F172A; color:#E2E8F0;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { max-width:420px; width:100%; background:#1E293B; border-radius:18px; padding:36px 28px; text-align:center; }
  .icon { width:64px; height:64px; margin:0 auto 18px; border-radius:50%; background:rgba(239,68,68,.12);
          display:flex; align-items:center; justify-content:center; font-size:30px; }
  h1 { font-size:19px; margin-bottom:10px; color:#F8FAFC; }
  p { font-size:13px; line-height:1.6; color:#94A3B8; margin-bottom:6px; word-break:break-all; }
  .hint { margin-top:16px; font-size:12px; color:#64748B; line-height:1.7; }
  button { margin-top:22px; background:#10B981; color:#052E1F; border:none; padding:12px 30px;
           border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; }
  .err { font-size:12px; color:#F87171; margin-top:10px; word-break:break-all; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">&#9888;</div>
    <h1>Unable to load this page</h1>
    <p class="err">__ERROR__</p>
    <p class="hint">This application loads its content from the web and may require an active
      internet connection, or the address below may be unavailable.</p>
    <p style="color:#475569">__URL__</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
